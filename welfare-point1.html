  <style>
    * {
      margin: 0;

      box-sizing: border-box;
    }

    body {
      font-family: 'Noto Sans KR', -apple-system, sans-serif;

      color: #333;
    }

    /* 1. 최상단 안내 띠 */
    .top-header {
      background-color: #F2F2F2;
      color: #000000;
      height: 30px;
      display: flex;

      border-bottom: 1px solid #e2e8f0;

    .top-header-container {

      margin: 0 auto;

      display: flex;
      align-items: center;
      gap: 10px;
    }

    .flag-icon {

      width: auto;

    }

    .top-header-text {

      font-weight: 500;
      letter-spacing: -0.3px;
    }

    /* 2. 로고 및 유틸리티 영역 */
    .header-middle {
      background-color: #ffffff;
      padding: 22px 0;
    }

    .header-middle-container {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand-logo a {
      display: flex;
      align-items: center;
      gap: 10px;

      font-size: 1.6rem;

    .util-bottom-links {

      align-items: center;

      text-decoration: none;

      display: flex;
      align-items: center;
      gap: 5px;

    /* 3. 메인 네비게이션바 */
    .navbar {
      background-color: #ffffff;
      border-top: 1px solid #f1f5f9;
      border-bottom: 2px solid #BFBFBF;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      position: relative;
    }

    .nav-container {
      max-width: 1280px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      padding: 0 20px;
      height: 55px;
    }

    .nav-menu {
      display: flex;
      list-style: none;
      height: 100%;
      gap: 15px;
    }

    .nav-item {
      position: static;
      height: 100%;
    }

    .nav-link {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 20px;
      height: 100%;
      text-decoration: none;
      color: #4a5568;
      font-weight: 700;
      font-size: 1.05rem;
      border-bottom: 3px solid transparent;
      transition: all 0.2s;
      cursor: pointer;
    }

    .menu-icon {
      width: 22px;
      height: 22px;
      object-fit: contain;
    }

    .nav-item.active > .nav-link {
      color: #4A5366;
      background-color: #f8fafc;
      border-bottom: 1px solid #BFBFBF;
    }

    .mega-dropdown {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
      width: 100%;
      background-color: #ffffff;
      border-bottom: 1px solid #e2e8f0;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.08);
      z-index: 1000;
      padding: 25px 0;
    }

    .nav-item.active .mega-dropdown {
      display: block;
    }

    .mega-dropdown-container {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 20px;
      display: flex;
      gap: 40px;
    }

    .mega-menu-list {
      list-style: none;
      display: flex;
      gap: 30px;
    }

    .mega-menu-list li a {
      text-decoration: none;
      font-size: 0.95rem;
      color: #4a5568;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 6px;
      transition: all 0.2s;
    }

    .mega-menu-list a:hover {
      color: #2563eb;
      background-color: #f1f5f9;
    }

    /* 4. 복지포인트 메인 컨테이너 */
    .welfare-container {
      max-width: 1100px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .page-header {
      margin-bottom: 20px;
    }

    .page-title {
      font-size: 1.5rem;
      font-weight: 800;
      color: #1e293b;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-bottom: 25px;
    }

    .summary-card {
      background: #ffffff;
      border-radius: 12px;
      padding: 25px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
      border: 1px solid #e2e8f0;
      text-align: center;
    }

    .card-title {
      font-size: 0.9rem;
      font-weight: 700;
      color: #64748b;
      margin-bottom: 10px;
    }

    .card-value {
      font-size: 1.8rem;
      font-weight: 800;
      color: #1e293b;
    }

    .card-value.blue { color: #2563eb; }
    .card-value.red { color: #ef4444; }

    .filter-card {
      background: #ffffff;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
      border: 1px solid #e2e8f0;
      margin-bottom: 25px;
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .filter-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .filter-group label {
      font-size: 0.9rem;
      font-weight: 700;
      color: #475569;
    }

    .form-control {
      padding: 8px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 0.9rem;
      outline: none;
    }

    .btn-search {
      padding: 8px 20px;
      background-color: #2563eb;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-weight: 700;
      cursor: pointer;
    }

    .table-card {
      background: #ffffff;
      border-radius: 12px;
      padding: 25px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
      border: 1px solid #e2e8f0;
    }

    .welfare-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    .welfare-table th {
      background-color: #f8fafc;
      padding: 12px 16px;
      font-size: 0.88rem;
      font-weight: 700;
      color: #475569;
      border-bottom: 2px solid #e2e8f0;
    }

    .welfare-table td {
      padding: 14px 16px;
      font-size: 0.9rem;
      color: #334155;
      border-bottom: 1px solid #f1f5f9;
    }

    .val-minus { color: #ef4444; font-weight: 700; }
    .val-plus { color: #2563eb; font-weight: 700; }
  </style>
</head>
<body>

    <div class="header-middle-container">

  <!-- 3. 메인 네비게이션바 (클릭으로 동작) -->
  <header class="navbar">
    <div class="nav-container">
      <ul class="nav-menu">
        <li class="nav-item">

            <img src="doc.png" alt="" class="menu-icon" onerror="this.style.display='none';">

        <li class="nav-item">

            <img src="pay.png" alt="" class="menu-icon" onerror="this.style.display='none';">
            <span>보수관리</span>

          <div class="mega-dropdown">
            <div class="mega-dropdown-container">
              <ul class="mega-menu-list">

                <li><a href="#">상여금관리</a></li>

        <li class="nav-item">
          <a href="#" class="nav-link">
            <img src="hr.png" alt="" class="menu-icon" onerror="this.style.display='none';">

          <div class="mega-dropdown">
            <div class="mega-dropdown-container">
              <ul class="mega-menu-list">

              </ul>

        </li>

        <li class="nav-item">

            <span>복리후생</span>
          </a>
          <div class="mega-dropdown">
            <div class="mega-dropdown-container">
              <ul class="mega-menu-list">
                <li><a href="welfare-point1.html" style="color: #2563eb; font-weight: 700;">복지포인트 조회</a></li>
                <li><a href="welfare-shop.html">상품 구매</a></li>
                <li><a href="welfare-point2">포인트 관리</a></li>

          </div>

      </ul>

  <!-- 4. 복지포인트 본문 영역 -->
  <main class="welfare-container">
    <div class="page-header">
      <h2 class="page-title">복지포인트 조회</h2>
    </div>

    <!-- 포인트 카드 영역 -->
    <div class="summary-grid">
      <div class="summary-card">
        <div class="card-title">배정받은 포인트</div>
        <div class="card-value">0 p</div>
      </div>
      <div class="summary-card">
        <div class="card-title">사용 포인트</div>

      </div>
      <div class="summary-card">
        <div class="card-title">잔여 포인트</div>
        <div class="card-value blue">0 p</div>
      </div>
    </div>

    <!-- 검색 조건 카드 -->
    <div class="filter-card">
      <div class="filter-group">
        <label>조회기간</label>
        <input type="date" id="startDate" class="form-control" value="2026-01-01">
        <span>~</span>
        <input type="date" id="endDate" class="form-control" value="2026-12-31">
      </div>

      <div class="filter-group" style="margin-left: 20px;">
        <label>구분</label>
        <select id="typeFilter" class="form-control">
          <option value="ALL">전체</option>
          <option value="USE">사용</option>
          <option value="GRANT">배정</option>
        </select>
      </div>

      <button class="btn-search" onclick="loadWelfareData()">조회</button>
    </div>

    <!-- 테이블 내역 카드 -->
    <div class="table-card">
      <table class="welfare-table">
        <thead>
          <tr>
            <th style="width: 15%;">사용일자</th>
            <th style="width: 12%;">구분</th>
            <th style="width: 43%;">사용처 / 내용</th>
            <th style="width: 15%;">포인트</th>
            <th style="width: 15%;">상태</th>
          </tr>
        </thead>
        <tbody>
        </tbody>
      </table>
    </div>
  </main>

<script>
  const SUPABASE_URL = 'https://arwwkmoeypsuzayrgkjd.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFyd3drbW9leXBzdXpheXJna2pkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzMjIyMTAsImV4cCI6MjEwMDg5ODIxMH0.sbfZXyCgQJli_6hUGMv2xtNwCB5aEWjReMyrngFT-F4';
  const supabaseClient = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;

  // 🔑 로그인 세션에서 사용자 이메일(ID) 동적 추출
  function getCurrentUserId() {
    const sessionData = sessionStorage.getItem('currentUser');
    if (!sessionData) return 'seoulmysoul'; 

    try {
      const parsed = JSON.parse(sessionData);
      return parsed.email || parsed.id || parsed;
    } catch (e) {
      return sessionData; 
    }
  }

  const currentUserId = getCurrentUserId();

  document.addEventListener('DOMContentLoaded', () => {
    // 네비게이션 토글
    document.querySelectorAll('.nav-link').forEach(link => {
      link.addEventListener('click', function(e) {
        e.preventDefault();
        e.stopPropagation();
        const currentItem = this.parentElement;
        
        document.querySelectorAll('.nav-item').forEach(item => {
          if (item !== currentItem) item.classList.remove('active');
        });
        
        currentItem.classList.toggle('active');
      });
    });

    document.addEventListener('click', function(e) {
      if (!e.target.closest('.nav-item')) {
        document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
      }
    });

    // 초기 포인트 데이터 로드
    loadWelfareData();
  });

  async function loadWelfareData() {
    if (!supabaseClient) return;

    try {
      // 1) 총 배정액 (point_grants)
      const { data: grantData } = await supabaseClient
        .from('point_grants')
        .select('amount')
        .eq('user_id', currentUserId);

      const totalGranted = grantData ? grantData.reduce((acc, cur) => acc + cur.amount, 0) : 0;

      // 2) 현재 잔액 (point_balances)
      const { data: balData } = await supabaseClient
        .from('point_balances')
        .select('current_balance')
        .eq('user_id', currentUserId)
        .maybeSingle();

      const currentBal = balData ? balData.current_balance : 0;
      const usedPoint = totalGranted - currentBal;

      // 상단 카드 UI 갱신 (전체 요약 통계)
      const cardValues = document.querySelectorAll('.summary-card .card-value');
      if (cardValues.length >= 3) {
        cardValues[0].innerText = totalGranted.toLocaleString() + ' p';
        cardValues[1].innerText = usedPoint.toLocaleString() + ' p';
        cardValues[2].innerText = currentBal.toLocaleString() + ' p';
      }

      // 3) 검색 필터 조건 값 읽기
      const startDateVal = document.getElementById('startDate').value;
      const endDateVal = document.getElementById('endDate').value;
      const typeFilterVal = document.getElementById('typeFilter').value;

      // 4) 거래 내역 테이블 동적 쿼리 생성
      let query = supabaseClient
        .from('point_transactions')
        .select('*')
        .eq('user_id', currentUserId);

      // 조회기간 시작일 조건
      if (startDateVal) {
        query = query.gte('created_at', `${startDateVal}T00:00:00`);
      }
      // 조회기간 종료일 조건
      if (endDateVal) {
        query = query.lte('created_at', `${endDateVal}T23:59:59`);
      }
      // 구분 조건 (USE, GRANT)
      if (typeFilterVal && typeFilterVal !== 'ALL') {
        query = query.eq('type', typeFilterVal);
      }

      const { data: txData, error: txError } = await query.order('created_at', { ascending: false });

      if (txError) throw txError;

      // 5) 테이블 결과 출력
      const tbody = document.querySelector('.welfare-table tbody');
      tbody.innerHTML = '';

      if (txData && txData.length > 0) {
        txData.forEach(item => {
          const tr = document.createElement('tr');
          const dateStr = new Date(item.created_at).toLocaleDateString();
          const isMinus = item.amount < 0;
          const displayAmount = (isMinus ? '- ' : '+ ') + Math.abs(item.amount).toLocaleString() + ' p';
          const typeName = item.type === 'USE' ? '사용' : (item.type === 'GRANT' ? '배정' : '취소');

          tr.innerHTML = `
            <td>${dateStr}</td>
            <td>${typeName}</td>
            <td>${item.description || '-'}</td>
            <td class="${isMinus ? 'val-minus' : 'val-plus'}">${displayAmount}</td>
            <td>완료</td>
          `;
          tbody.appendChild(tr);
        });
      } else {
        tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">조회 조건에 해당하는 내역이 없습니다.</td></tr>';
      }

    } catch (err) {
      console.error('포인트 데이터 로드 실패:', err);
    }
  }

  function handleLogout(e) {
    if (e) e.preventDefault();
    if (confirm('정말 로그아웃하시겠습니까?')) {
      sessionStorage.removeItem('currentUser');
      location.replace('login.html');
    }
  }
</script>

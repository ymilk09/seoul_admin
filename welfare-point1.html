<script>
  const SUPABASE_URL = 'https://arwwkmoeypsuzayrgkjd.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFyd3drbW9leXBzdXpheXJna2pkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzMjIyMTAsImV4cCI6MjEwMDg5ODIxMH0.sbfZXyCgQJli_6hUGMv2xtNwCB5aEWjReMyrngFT-F4';
  
  let supabaseClient = null;

  // 🔑 로그인 세션에서 사용자 이메일(ID) 동적 추출 함수
  function getCurrentUserId() {
    const sessionData = sessionStorage.getItem('currentUser');
    if (!sessionData) return '';

    try {
      const parsed = JSON.parse(sessionData);
      return parsed.email || parsed.id || parsed;
    } catch (e) {
      return sessionData; 
    }
  }

  document.addEventListener('DOMContentLoaded', () => {
    // Supabase 클라이언트 안전 초기화
    if (window.supabase) {
      supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    }

    // 네비게이션 토글
    document.querySelectorAll('.nav-link').forEach(link => {
      link.addEventListener('click', function(e) {
        e.preventDefault();
        e.stopPropagation();
        const currentItem = this.parentElement;
        
        document.querySelectorAll('.nav-item').forEach(item => {
          if (item !== currentItem) item.classList.remove('active');
        });
        
        currentItem.classList.toggle('active');
      });
    });

    document.addEventListener('click', function(e) {
      if (!e.target.closest('.nav-item')) {
        document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
      }
    });

    // 초기 데이터 로드
    loadWelfareData();
  });

  async function loadWelfareData() {
    // 💡 1. 동적으로 현재 사용자 ID 가져오기
    const currentUserId = getCurrentUserId();

    if (!currentUserId) {
      console.warn('로그인된 사용자 정보가 없습니다.');
      return;
    }

    if (!supabaseClient) {
      if (window.supabase) {
        supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      } else {
        console.error('Supabase 라이브러리를 로드하지 못했습니다.');
        return;
      }
    }

    const startDateInput = document.getElementById('startDate');
    const endDateInput = document.getElementById('endDate');
    const typeFilterInput = document.getElementById('typeFilter');

    const startDate = startDateInput ? startDateInput.value : '2000-01-01';
    const endDate = endDateInput ? endDateInput.value : '2099-12-31';
    const typeFilter = typeFilterInput ? typeFilterInput.value : 'ALL';

    try {
      // 💡 2. DB 실시간 잔액(point_balances) 직접 조회 (관리자 페이지와 동일)
      const { data: balanceData } = await supabaseClient
        .from('point_balances')
        .select('current_balance')
        .eq('user_id', currentUserId)
        .maybeSingle();

      const realTimeBalance = balanceData ? balanceData.current_balance : 0;

      // 💡 3. 필터링된 거래 내역(point_transactions) 조회
      let query = supabaseClient
        .from('point_transactions')
        .select('*')
        .eq('user_id', currentUserId)
        .gte('created_at', startDate + 'T00:00:00')
        .lte('created_at', endDate + 'T23:59:59')
        .order('created_at', { ascending: false });

      if (typeFilter !== 'ALL') {
        query = query.eq('type', typeFilter);
      }

      const { data: txData, error: txError } = await query;
      if (txError) throw txError;

      // 💡 4. 카드 집계용 전체 거래 내역 조회
      const { data: allTx, error: allTxError } = await supabaseClient
        .from('point_transactions')
        .select('amount, type')
        .eq('user_id', currentUserId);

      if (allTxError) throw allTxError;

      let totalGranted = 0; // 배정
      let totalRevoked = 0; // 회수
      let totalUsed = 0;    // 순수 사용
      let totalCanceled = 0;// 사용 취소

      if (allTx) {
        allTx.forEach(t => {
          if (t.type === 'GRANT') totalGranted += t.amount;
          else if (t.type === 'REVOKE') totalRevoked += Math.abs(t.amount);
          else if (t.type === 'USE') totalUsed += Math.abs(t.amount);
          else if (t.type === 'CANCEL') totalCanceled += t.amount;
        });
      }

      const netGranted = Math.max(0, totalGranted - totalRevoked);
      const netUsed = Math.max(0, totalUsed - totalCanceled);

      // 💡 5. 카드 UI 반영
      const elGranted = document.getElementById('grantedPointDisplay');
      const elUsed = document.getElementById('usedPointDisplay');
      const elRemain = document.getElementById('remainPointDisplay');

      if (elGranted) elGranted.innerText = netGranted.toLocaleString() + ' p';
      if (elUsed) elUsed.innerText = netUsed.toLocaleString() + ' p';
      // 잔여 포인트는 DB 실시간 잔액(point_balances) 값으로 표시
      if (elRemain) elRemain.innerText = realTimeBalance.toLocaleString() + ' p';

      // 💡 6. 하단 거래 내역 테이블 렌더링
      const tbody = document.getElementById('txTableBody');
      if (tbody) {
        tbody.innerHTML = '';

        if (txData && txData.length > 0) {
          txData.forEach(item => {
            const tr = document.createElement('tr');
            const dateStr = new Date(item.created_at).toLocaleDateString();
            const isMinus = item.amount < 0;
            const displayAmount = (isMinus ? '- ' : '+ ') + Math.abs(item.amount).toLocaleString() + ' p';

            let typeName = '기타';
            if (item.type === 'USE') typeName = '사용';
            else if (item.type === 'GRANT') typeName = '배정';
            else if (item.type === 'CANCEL') typeName = '취소';
            else if (item.type === 'REVOKE') typeName = '회수';

            tr.innerHTML = `
              <td>${dateStr}</td>
              <td>${typeName}</td>
              <td>${item.description || '-'}</td>
              <td class="${isMinus ? 'val-minus' : 'val-plus'}">${displayAmount}</td>
              <td>완료</td>
            `;
            tbody.appendChild(tr);
          });
        } else {
          tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">조회 조건에 해당하는 내역이 없습니다.</td></tr>';
        }
      }

    } catch (err) {
      console.error('데이터 조회 실패:', err);
    }
  }

  function handleLogout(e) {
    if (e) e.preventDefault();
    if (confirm('정말 로그아웃하시겠습니까?')) {
      sessionStorage.removeItem('currentUser');
      location.replace('login.html');
    }
  }
</script>
